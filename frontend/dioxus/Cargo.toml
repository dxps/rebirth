#########
[package]
#########

name = "rebirth-ui-dioxus"
version = "0.1.0"
authors = ["dxps <marius.ileana@gmail.com>"]
edition = "2021"

##############
[dependencies]
##############

dioxus = { version = "0.7.9", features = [] }
gloo-net = "0.7.0"
lucide-dioxus = { version = "3.11.0", features = ["all-icons"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wasm-bindgen = "0.2.122"
web-sys = { version = "0.3.99", features = ["Document", "Element", "History", "HtmlElement", "Location", "Storage", "Window"] }

##########
[features]
##########

default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
